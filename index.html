<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Shim window.fetch to have both getter and setter so browser extensions and interceptors can assign to it safely
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Fallback if defineProperty fails
        }

        // Prevent uncaught errors originating from browser extensions from breaking the app
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.includes('chrome-extension://')) ||
            (event.message && event.message.includes('Cannot set property fetch'))
          ) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerMill ML Plugin System</title>
    <meta name="description" content="Complete four-layer architecture and development workbench for Autodesk PowerMill C# plugins with embedded ONNX ML domain models and one-click PowerShell deployment." />

    <meta property="og:description" content="Complete four-layer architecture and development workbench for Autodesk PowerMill C# plugins with embedded ONNX ML domain models and one-click PowerShell deployment." />
  </head>
